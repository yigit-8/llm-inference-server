name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check src tests

      - name: Run tests
        run: pytest tests/ -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t llm-inference-server:${{ github.sha }} .

      - name: Smoke test container
        # A tiny random model keeps startup to a couple of seconds; the smoke test
        # is proving the server boots and serves, not that a real model is good.
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e MODEL_NAME=hf-internal-testing/tiny-random-gpt2 \
            llm-inference-server:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then ready=1; break; fi
            sleep 2
          done
          if [ -z "$ready" ]; then echo "server did not become healthy"; docker logs smoke; exit 1; fi
          curl --fail --silent http://localhost:8000/metrics > /dev/null
          curl --fail --silent -X POST http://localhost:8000/generate \
            -H 'Content-Type: application/json' \
            -d '{"prompt":"hello","max_new_tokens":4}' > /dev/null
          docker stop smoke

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push'
        run: |
          docker tag llm-inference-server:${{ github.sha }} ghcr.io/yigit-8/llm-inference-server:latest
          docker tag llm-inference-server:${{ github.sha }} ghcr.io/yigit-8/llm-inference-server:${{ github.sha }}
          docker push ghcr.io/yigit-8/llm-inference-server:latest
          docker push ghcr.io/yigit-8/llm-inference-server:${{ github.sha }}
