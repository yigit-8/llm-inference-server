services:
  server:
    build: .
    container_name: llm-inference-server
    ports:
      - "8000:8000"
    environment:
      - MODEL_NAME=distilgpt2
      - MAX_BATCH_SIZE=8
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      # The model is downloaded and loaded on startup, so give it room before the
      # first probe rather than flap unhealthy while weights are still loading.
      start_period: 120s

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: llm-inference-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - server

  grafana:
    image: grafana/grafana:11.1.0
    container_name: llm-inference-grafana
    ports:
      - "3000:3000"
    environment:
      # admin/admin is the local default; override GRAFANA_ADMIN_PASSWORD before
      # exposing this stack anywhere the port is reachable from outside the host.
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
